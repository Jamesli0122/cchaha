<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江阴时点贷款汇总表</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; color: #333; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.top-bar a { color: #1890ff; text-decoration: none; font-size: 14px; }
.top-bar a:hover { color: #1679d8; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 22px; color: #1a1a2e; }
.search-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.search-bar input, .search-bar select, .search-bar button { padding: 8px 14px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
.search-bar input { width: 320px; }
.search-bar input:focus, .search-bar select:focus { outline: none; border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,0.15); }
.search-bar button { background: #1890ff; color: #fff; border: none; cursor: pointer; font-weight: 500; min-width: 80px; }
.search-bar button:hover { background: #1679d8; }
.search-bar button.export { background: #52c41a; }
.search-bar button.export:hover { background: #49aa19; }
.status { text-align: center; margin-bottom: 8px; font-size: 13px; color: #888; min-height: 24px; }
.table-wrapper { overflow-x: auto; background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
thead { background: #fafafa; }
th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid #f0f0f0; }
th { font-weight: 600; color: #555; position: sticky; top: 0; background: #fafafa; }
th.left, td.left { text-align: left; }
tr:hover td { background: #e6f7ff; }
.year-col { min-width: 130px; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <a href="/">← 返回首页</a>
    <span style="font-size:13px;color:#aaa;">数据截止至每年12月31日</span>
  </div>
  <div class="header"><h1>江阴时点贷款汇总表</h1></div>
  <div class="search-bar">
    <select id="searchType">
      <option value="zjh">证件号码</option>
      <option value="khmc">客户名称</option>
    </select>
    <input id="keyword" type="text" placeholder="输入证件号码或客户名称" autofocus>
    <button onclick="doSearch()">查询</button>
    <button class="export" onclick="doExport()">导出 Excel</button>
  </div>
  <div class="status" id="status"></div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th class="left">客户名称</th>
          <th class="left">证件号码</th>
          <th class="year-col">2022年末余额</th>
          <th class="year-col">2023年末余额</th>
          <th class="year-col">2024年末余额</th>
          <th class="year-col">2025年末余额</th>
          <th class="year-col">2026年末余额</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const FIELDS = ["客户名称","证件号码","Y2022","Y2023","Y2024","Y2025","Y2026"];
const YEAR_LABELS = ["2022年末余额","2023年末余额","2024年末余额","2025年末余额","2026年末余额"];

function fmtNum(v) {
  if (v == null || v === 0) return "0.00";
  return Number(v).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderRows(rows) {
  const tbody = document.getElementById('tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#aaa;padding:32px;">暂无数据</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r =>
    '<tr>' +
    '<td class="left">' + (r["客户名称"] ?? '') + '</td>' +
    '<td class="left">' + (r["证件号码"] ?? '') + '</td>' +
    FIELDS.slice(2).map(f => '<td>' + fmtNum(r[f]) + '</td>').join('') +
    '</tr>'
  ).join('');
}

async function doSearch() {
  const q = document.getElementById('keyword').value.trim();
  const type = document.getElementById('searchType').value;
  if (!q) { document.getElementById('status').textContent = '请输入查询条件'; return; }
  document.getElementById('status').textContent = '查询中…';
  try {
    const resp = await fetch(
      `/api/summary?q=${encodeURIComponent(q)}&type=${type}`
    );
    const data = await resp.json();
    document.getElementById('status').textContent =
      data.total > 0 ? `共找到 ${data.total} 条记录` : '未找到匹配记录';
    renderRows(data.rows);
  } catch (e) {
    document.getElementById('status').textContent = '查询失败：' + e.message;
  }
}

function doExport() {
  const q = document.getElementById('keyword').value.trim();
  const type = document.getElementById('searchType').value;
  if (!q) { document.getElementById('status').textContent = '请输入查询条件'; return; }
  document.getElementById('status').textContent = '正在导出…';
  window.location.href = `/api/summary/export?q=${encodeURIComponent(q)}&type=${type}`;
  document.getElementById('status').textContent = '导出已开始，请在下载栏查看文件';
}

document.getElementById('keyword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
